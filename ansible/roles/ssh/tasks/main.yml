# roles/ssh/tasks/main.yml
- name: Ensure at least one SSH key exists
  assert:
    that:
      - ssh_public_keys is defined
      - ssh_public_keys | length > 0

- name: Add SSH public keys for admin login
  ansible.posix.authorized_key:
    user: "{{ ssh_admin_user }}"
    state: present
    key: "{{ item | trim }}"
    exclusive: true
  loop: "{{ ssh_public_keys }}"

- name: Ensure SSH config hardened
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^PubkeyAuthentication', line: 'PubkeyAuthentication yes' }


- name: Validate sshd config
  command: sshd -t
  changed_when: false

- name: Install deploy script
  copy:
    src: deploy.sh
    dest: /usr/local/bin/deploy.sh
    mode: '0755'
    owner: root
    group: root

- name: Install deploy jobs script
  copy:
    src: deploy.sh
    dest: /usr/local/bin/deploy_jobs.sh
    mode: '0755'
    owner: root
    group: root

# Note key options has to be one line as >- folds newlines as spaces which the
# key doesnt like when in command mode
- name: Add GitHub deploy key (restricted)
  authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ github_deploy_ssh_key }}"
    state: present
    exclusive: true
    key_options: 'command="/usr/local/bin/deploy.sh",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty'

- name: Ensure .ssh directory exists for job user
  ansible.builtin.file:
    path: "/home/{{ job_user }}/.ssh"
    state: directory
    owner: "{{ job_user }}"
    group: "{{ job_user }}"
    mode: "0700"

- name: Add Setonix ED25519 host key
  ansible.builtin.known_hosts:
    path: /home/{{ job_user }}/.ssh/known_hosts
    name: setonix.pawsey.org.au
    key: "setonix.pawsey.org.au ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKcmqXbKCdJ7EHa2U2WSL+91E3rMp2Sd3BEyZEqpfNG6"
    state: present

- name: Add Setonix RSA host key
  ansible.builtin.known_hosts:
    path: /home/{{ job_user }}/.ssh/known_hosts
    name: setonix.pawsey.org.au
    key: "setonix.pawsey.org.au ssh-rsa "
    state: present

- name: Install SSH private key
  ansible.builtin.copy:
    src: files/setonix_ssh_key
    dest: /home/{{ job_user }}/.ssh/setonix
    owner: "{{ job_user }}"
    group: "{{ job_user }}"
    mode: '0600'