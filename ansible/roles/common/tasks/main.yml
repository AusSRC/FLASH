# roles/common/tasks/main.yml
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade system
  apt:
    upgrade: dist

- name: Install base packages
  apt:
    name:
      - curl
      - git
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - iputils-ping
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    state: present
    create_home: true
    shell: /bin/bash

- name: Create job user
  ansible.builtin.user:
    name: "{{ job_user }}"
    state: present
    create_home: true
    shell: /bin/bash