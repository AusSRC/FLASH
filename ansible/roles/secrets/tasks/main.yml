- name: Create secrets directory
  file:
    path: /etc/flashdb
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy secrets into that location
  copy:
    src: "{{ env }}/secrets.env"
    dest: /etc/flashdb/secrets.env
    owner: root
    group: docker
    mode: "0640"

- name: Create job version file which will be update by deploy & read by job
  ansible.builtin.copy:
    dest: /etc/flashdb/job_version.env
    content: |
      FLASH_JOB_IMAGE_TAG=0.0.0
    owner: "{{ deploy_user }}"
    group: docker
    mode: "0664"
    force: false